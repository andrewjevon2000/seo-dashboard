# Local Postgres for the Verihubs SEO Dashboard (development only).
#   docker compose up -d       # start
#   docker compose down        # stop (keeps data)
#   docker compose down -v      # stop and wipe the volume
#
# Connection string (matches .env.local):
#   postgres://postgres:postgres@localhost:5432/seo_dashboard
services:
  db:
    image: postgres:16-alpine
    container_name: verihubs-seo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seo_dashboard
    ports:
      - "5432:5432"
    volumes:
      - seo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seo_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  seo_pgdata:
